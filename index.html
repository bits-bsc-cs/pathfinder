<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinder — BSc Computer Science · BITS Pilani</title>
    <meta
      name="description"
      content="Plan your BITS Pilani BSc Computer Science journey — pick electives, track prerequisites, and visualize your path to graduation."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="theme-light">
    <div id="app">
      <header id="app-header">
        <div id="brand-text">
          <span id="brand-title">Pathfinder</span>
          <span id="brand-sub">Student-run planner · not affiliated with BITS Pilani</span>
        </div>

        <div id="header-right">
          <div id="progress-bar" role="status" aria-label="Degree progress"></div>
          <button
            id="theme-toggle-btn"
            data-action="toggle-theme"
            class="btn btn-ghost btn-sm"
            aria-label="Switch to dark theme"
          ></button>
          <button
            id="reset-btn"
            data-action="reset-btn"
            class="btn btn-ghost btn-sm"
          >
            Reset
          </button>
        </div>
      </header>

      <main id="page">
        <div id="page-content"></div>

        <footer id="page-footer">
          <span>Progress is saved in your browser.</span>
          <a
            href="https://github.com/bits-bsc-cs/pathfinder"
            target="_blank"
            rel="noopener noreferrer"
            >Source code</a
          >
        </footer>
      </main>
    </div>

    <script src="data.js"></script>
    <script src="state.js"></script>
    <script src="render.js"></script>
    <script src="app.js"></script>
  </body>
</html>
